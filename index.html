function jobDetail(id){const j=job(id),p=profile(),existing=db.applications.find(a=>a.job===id&&a.profile===p.id&&!['withdrawn','declined','rejected'].includes(a.status));openModal(esc(j.title),`<div class="flex" style="margin-bottom:20px"><div class="company-logo ${j.color}">${esc(j.logo)}</div><div><strong>${esc(j.company)}</strong><div class="small">${esc(j.province)} · ${esc(j.type)}</div></div></div><div class="flex between"><span class="salary">฿${money(j.salary)} / เดือน</span>${badge('รับ '+j.slots+' คน')}</div><div class="tags">${j.skills.map(s=>`<span class="tag">${esc(s)}</span>`).join('')}</div><h3>ลักษณะงาน</h3><p>${esc(j.detail)}</p><h3>เวลาและการสนับสนุน</h3><p>${esc(j.hours)}</p><div class="note">${esc(j.support)}</div>${!isEmp()?`<h3>ความสอดคล้องกับโปรไฟล์ ${esc(p.nickname)}</h3><p class="small">${score(j)}% = คะแนนพื้นฐาน 30 + ทักษะที่ตรง ${Math.round(j.skills.filter(s=>p.skills.includes(s)).length/j.skills.length*50)} + จังหวัด ${j.province===p.province?20:0} คะแนน เป็นคำแนะนำเบื้องต้น ไม่ใช่การรับรองว่าจะได้งาน</p>`:''}<div class="modal-foot">${isEmp()&&j.owned?btn('แก้ไขประกาศ',`editJob('${id}')`)+btn(j.open?'ปิดรับสมัคร':'เปิดรับสมัคร',`toggleJob('${id}')`,'primary'):existing?btn('ดูใบสมัครของฉัน',`applicationDetail('${existing.id}')`,'primary'):j.open?btn('สมัครงานนี้',`applyJob('${id}')`,'primary'):badge('ปิดรับสมัครแล้ว','gray')}</div>`)}
function applyJob(id){const p=profile();openModal('สมัครงาน · '+esc(job(id).title),`<form onsubmit="event.preventDefault();submitApplication('${id}',this)"><div class="note">สมัครด้วยโปรไฟล์ ${esc(p.name)} · ${esc(p.skills.join(', '))}</div>${area('แนะนำตัว / เวลาที่สะดวก','note','', 'required maxlength="1000"')}<label class="check"><input name="consent" type="checkbox" required>ยินยอมให้สถานประกอบการนี้ดูโปรไฟล์ ทักษะ และการสนับสนุนที่ระบุเพื่อพิจารณาสมัครงาน</label><div class="modal-foot"><button class="btn primary">ส่งใบสมัคร</button></div></form>`)}

function saveJobForm(id,f){const d=Object.fromEntries(new FormData(f)),skills=d.skills.split(',').map(s=>s.trim()).filter(Boolean);if(!skills.length)return toast('กรุณาระบุทักษะอย่างน้อยหนึ่งรายการ');const values={...d,skills,salary:Number(d.salary),slots:Number(d.slots)};if(id)Object.assign(job(id),values);else db.jobs.unshift({...values,id:uid(),company:db.company.name,owned:true,open:true,logo:'G',color:''});persist();closeModal();go('jobs');toast('บันทึกประกาศแล้ว')}
function toggleJob(id){job(id).open=!job(id).open;persist();closeModal();render();toast(job(id).open?'เปิดรับสมัครแล้ว':'ปิดรับสมัครแล้ว ใบสมัครเดิมยังคงอยู่')}
function applicationsPage(){const list=visibleApps().filter(a=>appFilter==='all'||a.status===appFilter);return heading(isEmp()?'ผู้สมัครและการจ้างงาน':'การสมัครงานของฉัน','ติดตามทุกขั้นตอน ตั้งแต่ใบสมัครจนถึงวันเริ่มงาน')+`<div class="tabbar">${[['all','ทั้งหมด'],['submitted','ใบสมัครใหม่'],['review','พิจารณา'],['interview','สัมภาษณ์'],['offer','ข้อเสนองาน'],['hired','เริ่มงานแล้ว'],['withdrawn','ถอนใบสมัคร'],['rejected','ไม่ผ่าน'],['declined','ปฏิเสธข้อเสนอ']].map(([v,t])=>`<button class="${appFilter===v?'on':''}" onclick="appFilter='${v}';render()">${t}</button>`).join('')}</div>${list.map(a=>`<article class="list-card"><div class="flex between wrap"><div class="flex"><div class="company-logo">${esc(job(a.job).logo)}</div><div><h3>${esc(job(a.job).title)}</h3><div class="small">${esc(isEmp()?person(a.profile).name:job(a.job).company)} · สมัคร ${fmtDate(a.date)}</div></div></div>${badge(statusNames[a.status],a.status==='interview'?'orange':a.status==='rejected'?'gray':'')}</div><div class="status-line" aria-label="สถานะ ${statusNames[a.status]}">${['submitted','review','interview','offer','hired'].map((s,i)=>`<span class="${i<=['submitted','review','interview','offer','hired'].indexOf(a.status)?'done':''}"></span>`).join('')}</div>${a.status==='interview'?`<div class="small">${ic('calendar')} ${fmtDate(a.interview.date)} · ${esc(a.interview.place)} ${a.interview.confirmed?'· ยืนยันนัดแล้ว':''}</div>`:''}<div class="actions">${btn('ดูรายละเอียดและดำเนินการ',`applicationDetail('${a.id}')`,'primary')}${btn('ข้อความ',"go('messages')",'','message')}</div></article>`).join('')||empty('ยังไม่มีใบสมัครในสถานะนี้',!isEmp()?btn('ค้นหางาน',"go('jobs')",'primary'):'')}`}
function applicationDetail(id){const a=db.applications.find(a=>a.id===id),p=person(a.profile);let actions='';if(isEmp()){if(a.status==='submitted')actions+=btn('เริ่มพิจารณา',`changeStatus('${id}','review')`,'primary');if(['submitted','review','interview'].includes(a.status))actions+=btn(a.status==='interview'?'เปลี่ยนนัดสัมภาษณ์':'นัดสัมภาษณ์',`interviewForm('${id}')`);if(['review','interview'].includes(a.status))actions+=btn('เสนอรับเข้าทำงาน',`offerForm('${id}')`,'primary');if(['submitted','review','interview'].includes(a.status))actions+=btn('ไม่ผ่านการพิจารณา',`rejectForm('${id}')`,'danger')}else{if(a.status==='interview'&&!a.interview.confirmed)actions+=btn('ยืนยันเข้าร่วมสัมภาษณ์',`confirmInterview('${id}')`,'primary');if(a.status==='offer')actions+=btn('ยอมรับข้อเสนอ',`changeStatus('${id}','hired')`,'primary')+btn('ปฏิเสธข้อเสนอ',`confirmStatus('${id}','declined')`);if(['submitted','review','interview'].includes(a.status))actions+=btn('ถอนใบสมัคร',`confirmStatus('${id}','withdrawn')`,'danger')}openModal('รายละเอียดการสมัคร',`<div class="flex between wrap"><h3>${esc(job(a.job).title)}</h3>${badge(statusNames[a.status])}</div><p class="muted">${esc(p.name)} · ${esc(job(a.job).company)}</p><div class="tags">${p.skills.map(s=>`<span class="tag">${esc(s)}</span>`).join('')}</div><h3>การสนับสนุนที่ต้องการ</h3><p>${esc(p.support)}</p><h3>ข้อความจากผู้สมัคร</h3><p>${esc(a.note)}</p>${a.interview?`<div class="note"><strong>นัดสัมภาษณ์ ${fmtDate(a.interview.date)}</strong><br>${esc(a.interview.place)}<br>${esc(a.interview.note)}<br>สถานะ: ${a.interview.confirmed?'ยืนยันเข้าร่วมแล้ว':'รอผู้สมัครยืนยัน'}</div>`:''}${a.offer?`<div class="note"><strong>ข้อเสนองาน</strong><br>เริ่มงาน ${fmtDate(a.start)} · ฿${money(a.offer.salary)} / เดือน<br>${esc(a.offer.note)}</div>`:''}${a.reason?`<p>เหตุผล / ข้อเสนอแนะ: ${esc(a.reason)}</p>`:''}<h3>ประวัติการดำเนินการ</h3><div class="timeline">${a.history.map(h=>`<div class="timeline-item small">${fmtDate(h.date)} · ${esc(h.text)}</div>`).join('')}</div><div class="modal-foot wrap">${actions||btn('ปิด',"closeModal()")}</div>`)}
function changeStatus(id,status){const a=db.applications.find(a=>a.id===id);a.status=status;a.history.push({text:statusNames[status],date:today()});notify(isEmp()?'family':'employer',`${person(a.profile).nickname} · ${job(a.job).title}: ${statusNames[status]}`,'applications');persist();closeModal();render();toast('อัปเดตสถานะแล้ว')}
function confirmStatus(id,status){openModal(statusNames[status],`<p>ต้องการ${statusNames[status]}ใช่ไหม? ประวัติการสมัครจะยังคงอยู่</p><div class="modal-foot">${btn('กลับ',`applicationDetail('${id}')`)}${btn('ยืนยัน',`changeStatus('${id}','${status}')`,'danger')}</div>`)}
function interviewForm(id){const a=db.applications.find(a=>a.id===id);openModal('นัดสัมภาษณ์',`<form onsubmit="event.preventDefault();saveInterview('${id}',this)">${field('วันและเวลา','date',a.interview?.date||'','datetime-local','required')}${field('สถานที่ / ช่องทางออนไลน์','place',a.interview?.place||'','text','required')}${area('สิ่งที่ควรเตรียมและการอำนวยความสะดวก','note',a.interview?.note||'สามารถมาพร้อมผู้ปกครองได้')}<div class="modal-foot"><button class="btn primary">บันทึกและแจ้งผู้สมัคร</button></div></form>`)}
function saveInterview(id,f){const d=Object.fromEntries(new FormData(f));if(new Date(d.date)<new Date()){toast('กรุณาเลือกเวลานัดในอนาคต');return}const a=db.applications.find(a=>a.id===id);a.interview={...d,confirmed:false};changeStatus(id,'interview')}
function confirmInterview(id){db.applications.find(a=>a.id===id).interview.confirmed=true;notify('employer','ผู้สมัครยืนยันนัดสัมภาษณ์แล้ว','applications');persist();applicationDetail(id);toast('ยืนยันนัดสัมภาษณ์แล้ว')}
function offerForm(id){openModal('เสนอรับเข้าทำงาน',`<form onsubmit="event.preventDefault();saveOffer('${id}',this)">${field('วันเริ่มงาน','start','','date','required')}${field('ค่าตอบแทนต่อเดือน (บาท)','salary',job(db.applications.find(a=>a.id===id).job).salary,'number','required min="0"')}${area('รายละเอียด / ผู้ดูแลช่วงเริ่มงาน','note','มีพี่เลี้ยงดูแลในช่วงเริ่มงาน','required')}<div class="modal-foot"><button class="btn primary">ส่งข้อเสนอให้ผู้สมัคร</button></div></form>`)}
function saveOffer(id,f){const d=Object.fromEntries(new FormData(f)),a=db.applications.find(a=>a.id===id);a.start=d.start;a.offer={salary:Number(d.salary),note:d.note};changeStatus(id,'offer')}
function rejectForm(id){openModal('แจ้งผลการพิจารณา',`<form onsubmit="event.preventDefault();db.applications.find(a=>a.id==='${id}').reason=new FormData(this).get('reason');changeStatus('${id}','rejected')">${area('เหตุผลและคำแนะนำที่เป็นประโยชน์','reason','','required')}<div class="modal-foot"><button class="btn danger">แจ้งผลไม่ผ่านการพิจารณา</button></div></form>`)}
function candidatesPage(){const list=db.profiles.filter(p=>p.consent);return heading('ค้นพบความสามารถที่หลากหลาย','เลือกตำแหน่งงานเพื่อดูความสอดคล้องกับทักษะของผู้สมัคร')+`<div class="filters"><select aria-label="เลือกตำแหน่งงานเพื่อจับคู่" id="candidateJob" onchange="renderCandidates(this.value)">${db.jobs.filter(j=>j.owned&&j.open).map(j=>`<option value="${j.id}">${esc(j.title)}</option>`).join('')}</select></div><div id="candidateResults">${candidateCards(db.jobs.find(j=>j.owned&&j.open)?.id)}</div><div class="note">แสดงเฉพาะโปรไฟล์ที่ยินยอมให้ค้นพบ คะแนนเป็นการจำลองตามทักษะและจังหวัด ไม่มีการใช้การวินิจฉัยเป็นเกณฑ์คัดเลือก</div>`}
function candidateCards(jid){const j=job(jid);if(!j)return empty('กรุณาสร้างหรือเปิดประกาศงานก่อน');return `<div class="jobs">${db.profiles.filter(p=>p.consent).sort((a,b)=>score(j,b)-score(j,a)).map(p=>`<article class="panel"><div class="profile-top"><div class="avatar">${esc(p.nickname[0])}</div><div><h3>${esc(p.name)}</h3><p class="small">${esc(p.province)} · ${p.age} ปี</p></div></div>${badge(score(j,p)+'% ทักษะสอดคล้อง')}<p style="margin-top:15px">${esc(p.bio)}</p><div class="tags">${p.skills.map(s=>`<span class="tag">${esc(s)}</span>`).join('')}</div><p class="small">การสนับสนุน: ${esc(p.support)}</p>${btn('เชิญให้สมัครงาน',`invite('${p.id}','${jid}')`,'primary')}</article>`).join('')}</div>`}
function renderCandidates(id){document.getElementById('candidateResults').innerHTML=candidateCards(id)}
function invite(pid,jid){const text=`เชิญคุณ${person(pid).nickname} สมัครตำแหน่ง ${job(jid).title} หากสนใจสามารถดูรายละเอียดและสมัครผ่านหน้าค้นหางานได้`;db.messages.push({id:uid(),from:'employer',text,date:fmtDate(today())});notify('family',text,'jobs');persist();toast('ส่งคำเชิญในข้อความตัวอย่างแล้ว')}
function trainingPage(){if(isEmp())return heading('การพัฒนาทักษะ','ติดตามทักษะของผู้สมัครและแนะนำหลักสูตรที่สัมพันธ์กับงาน')+`<div class="panel table-wrap"><table><thead><tr><th>ผู้สมัคร</th><th>ทักษะในโปรไฟล์</th><th>หลักสูตรที่ผ่าน</th><th>การดำเนินการ</th></tr></thead><tbody>${db.profiles.filter(p=>p.consent||db.applications.some(a=>a.profile===p.id&&job(a.job).owned)).map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.skills.join(', '))}</td><td>${courses.filter(c=>training(p,c.id).passed).length} / ${courses.length}</td><td>${btn('แนะนำหลักสูตร',`recommendCourse('${p.id}')`)}</td></tr>`).join('')}</tbody></table></div>`;return heading('เรียนรู้ในจังหวะของคุณ','บทเรียนสั้น ๆ เพื่อพัฒนาทักษะและเตรียมพร้อมสู่การทำงาน')+`<div class="course-grid">${courses.map((c,i)=>{const t=training(profile(),c.id);return `<article class="panel"><div class="course-art ${c.color}">${ic(c.icon)}<b>0${i+1}</b></div>${badge(c.category,'gray')}<h3 style="margin-top:13px">${c.name}</h3><p class="small">3 บทเรียน · ${c.duration}</p><p class="small">ทักษะที่ได้: ${c.skill}</p><div class="flex between small"><span>${t.passed?'ผ่านแบบประเมินแล้ว':t.enrolled?'กำลังเรียน':'พร้อมเริ่มเรียน'}</span><span>${t.lessons.length}/3 บท</span></div><div class="progress"><span style="width:${t.lessons.length/3*100}%"></span></div>${btn(t.passed?'ทบทวน / ดูใบรับรอง':t.enrolled?'เรียนต่อ':'ลงทะเบียนเรียน',`courseDetail('${c.id}')`,'primary')}</article>`}).join('')}</div><div class="note">บทเรียนและแบบประเมินนี้เป็นตัวอย่างสำหรับทดสอบระบบ ใบรับรองที่ได้รับไม่ใช่ใบรับรองจากมูลนิธิ</div>`}
function courseDetail(id){const c=courses.find(c=>c.id===id),t=training(profile(),id);openModal(c.name,`<p class="muted">${c.category} · ${c.duration}</p>${!t.enrolled?`<p>ฝึกทีละขั้น ทบทวนได้ทุกเมื่อ หลังเรียนครบจะมีแบบประเมินสั้น ๆ</p>${btn('ยืนยันลงทะเบียน',`enroll('${id}')`,'primary')}`:`${c.lessons.map((l,i)=>`<div class="mini-row"><span class="step-num">${t.lessons.includes(i)?'✓':i+1}</span><div style="flex:1"><strong>${l[0]}</strong><p>บทเรียนที่ ${i+1}</p></div>${btn('เปิดบทเรียน',`lesson('${id}',${i})`)}</div>`).join('')}<div class="modal-foot wrap">${t.lessons.length===3?btn('ทำแบบประเมิน',`quiz('${id}')`,'primary'):'<span class="small">เรียนให้ครบ 3 บทเพื่อทำแบบประเมิน</span>'}${t.passed?btn('ใบรับรองตัวอย่าง',`certificate('${id}')`):''}</div>`}`)}
function enroll(id){db.training[db.active]||={};db.training[db.active][id]||={enrolled:true,lessons:[],passed:false};persist();render();courseDetail(id);toast('ลงทะเบียนแล้ว เริ่มบทแรกได้เลย')}
function lesson(id,i){const c=courses.find(c=>c.id===id);openModal(c.lessons[i][0],`<div class="eyebrow">บทเรียนที่ ${i+1} / 3</div><p style="font-size:18px;line-height:2">${c.lessons[i][1]}</p><div class="note">ลองฝึกตามขั้นตอนด้วยตนเอง หรือให้ผู้ปกครองช่วยอ่านและทบทวนร่วมกัน</div><div class="modal-foot">${btn('อ่านและฝึกบทนี้แล้ว',`completeLesson('${id}',${i})`,'primary')}</div>`)}
function completeLesson(id,i){const t=db.training[db.active][id];if(!t.lessons.includes(i))t.lessons.push(i);persist();render();courseDetail(id)}
function quiz(id){const c=courses.find(c=>c.id===id);openModal('แบบประเมิน · '+c.name,`<form onsubmit="event.preventDefault();grade('${id}',Number(new FormData(this).get('answer')))"><h3>${c.question}</h3>${c.options.map((o,i)=>`<label class="check list-card"><input type="radio" name="answer" value="${i}" required>${o}</label>`).join('')}<div class="modal-foot"><button class="btn primary">ตรวจคำตอบ</button></div></form>`)}
function grade(id,answer){const c=courses.find(c=>c.id===id);if(answer!==c.answer){toast('ยังไม่ถูก ลองทบทวนบทเรียนแล้วตอบอีกครั้ง');return}db.training[db.active][id].passed=true;if(!profile().skills.includes(c.skill))profile().skills.push(c.skill);persist();render();openModal('เก่งมาก คุณผ่านการประเมินแล้ว',`<div class="empty"><div class="score">100%</div><h3>${c.name}</h3><p>อัปเดตทักษะ ${c.skill} ในโปรไฟล์ของคุณแล้ว</p>${btn('ดูใบรับรองตัวอย่าง',`certificate('${id}')`,'primary')}</div>`)}
function certificate(id){const c=courses.find(c=>c.id===id);openModal('ใบรับรองตัวอย่าง',`<div style="padding:30px;text-align:center;border:2px solid #c5d9c9;border-radius:15px"><div class="eyebrow">HORIZON TOGETHER</div><h2>ใบรับรองการเรียนรู้</h2><p>มอบให้แก่</p><h2>${esc(profile().name)}</h2><p>ได้ผ่านหลักสูตร “${c.name}”</p>${badge('ผลการประเมิน 100%')}<p class="small" style="margin-top:20px">เอกสารจำลองสำหรับ Prototype เท่านั้น</p></div><div class="modal-foot">${btn('ดาวน์โหลดใบรับรอง',`downloadCertificate('${id}')`,'primary','download')}</div>`)}
function downloadCertificate(id){const c=courses.find(c=>c.id===id);download('certificate-'+id+'.html','<!doctype html><meta charset="utf-8"><title>ใบรับรองตัวอย่าง</title><body style="font-family:Tahoma;text-align:center;padding:80px;border:8px double #087363"><h2>ขอบฟ้ากว้าง</h2><h1>ใบรับรองการเรียนรู้</h1><p>มอบให้แก่</p><h2>'+esc(profile().name)+'</h2><p>ผ่านหลักสูตร '+c.name+'</p><p>ผลการประเมิน 100%</p><hr><p>เอกสารจำลองสำหรับ Prototype เท่านั้น ไม่ใช่ใบรับรองจากมูลนิธิ</p></body>','text/html')}
function recommendCourse(pid){openModal('แนะนำหลักสูตรให้ '+esc(person(pid).nickname),`<form onsubmit="event.preventDefault();sendCourseRecommendation('${pid}',this)">${selectField('หลักสูตร','course',courses.map(c=>c.name),courses[0].name)}<div class="modal-foot"><button class="btn primary">ส่งคำแนะนำ</button></div></form>`)}
function sendCourseRecommendation(pid,f){const c=new FormData(f).get('course');db.messages.push({id:uid(),from:'employer',text:'แนะนำให้คุณ'+person(pid).nickname+'เรียนหลักสูตร '+c,date:fmtDate(today())});notify('family','ได้รับคำแนะนำหลักสูตร '+c,'training');persist();closeModal();toast('ส่งคำแนะนำแล้ว')}
function progressPage(){const p=profile(),hired=visibleApps().filter(a=>a.status==='hired'),logs=db.logs.filter(l=>isEmp()?db.applications.some(a=>a.profile===l.profile&&a.status==='hired'&&job(a.job).owned):l.profile===p.id);return heading(isEmp()?'ติดตามหลังเริ่มงาน':'ทุกก้าวของการเติบโต','บันทึกสิ่งที่ทำได้ดี สิ่งที่ต้องการความช่วยเหลือ และวางแผนก้าวถัดไป',btn('บันทึกการติดตาม',"logForm()",'primary','plus'))+`<div class="columns"><div><div class="panel"><h2>สถานะการทำงาน</h2>${hired.map(a=>`<div class="list-card"><h3>${esc(person(a.profile).name)}</h3><p>${esc(job(a.job).title)} · ${esc(job(a.job).company)}</p><p class="small">เริ่มงาน ${fmtDate(a.start)}</p><div class="tags">${[1,2,3].map(m=>{const d=new Date(a.start+'T12:00');d.setMonth(d.getMonth()+m);return badge(`เดือน ${m} · ${d.toLocaleDateString('th-TH',{day:'numeric',month:'short'})}`,'blue')}).join('')}</div></div>`).join('')||empty('ยังไม่มีงานที่เริ่มแล้ว คุณบันทึกพัฒนาการระหว่างเตรียมตัวได้')}</div><div class="panel"><h2>บันทึกพัฒนาการ</h2><div class="timeline">${logs.slice().reverse().map(l=>`<div class="timeline-item"><div class="small">${fmtDate(l.date)} · ${esc(person(l.profile).nickname)} · ${l.by==='employer'?'สถานประกอบการ':'ผู้ปกครอง / บุคคลพิเศษ'}</div><h3 style="margin-top:7px">${esc(l.mood)} · ระดับทักษะ ${l.skill}/5</h3><p>${esc(l.text)}</p>${l.period?badge('ติดตาม '+l.period+(l.retained?' · ยังคงทำงานอยู่':'')):''}</div>`).join('')||empty('เริ่มบันทึกก้าวแรกของคุณ')}</div></div></div><div><div class="panel"><h2>แนวทางติดตาม 3 เดือน</h2>${[['1','ปรับตัวและรู้จักงาน','สื่อสารกับพี่เลี้ยง ทบทวนขั้นตอน'],['2','เพิ่มความมั่นใจ','ปรับงานและสภาพแวดล้อมร่วมกัน'],['3','ทบทวนความต่อเนื่อง','ประเมินการคงอยู่ในงานและเป้าหมายต่อไป']].map(x=>`<div class="mini-row"><span class="step-num">${x[0]}</span><div><strong>${x[1]}</strong><p>${x[2]}</p></div></div>`).join('')}</div><div class="note">บันทึกนี้ใช้เพื่อการพัฒนาทักษะและการทำงาน ไม่ใช่การประเมินหรือวินิจฉัยทางการแพทย์</div></div></div>`}
function logForm(){const people=isEmp()?db.profiles.filter(p=>db.applications.some(a=>a.profile===p.id&&a.status==='hired'&&job(a.job).owned)):[profile()];if(!people.length)return toast('ยังไม่มีผู้เริ่มงานให้ติดตาม');openModal('บันทึกพัฒนาการและการติดตาม',`<form onsubmit="event.preventDefault();saveLog(this)"><div class="field"><label for="f-person">โปรไฟล์</label><select name="profile" id="f-person">${people.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div><div class="form-grid">${field('วันที่บันทึก','date',today(),'date','required')}${selectField('ความรู้สึก / ภาพรวม','mood',['ดี','กำลังปรับตัว','ต้องการความช่วยเหลือ'],'ดี')}${selectField('ระดับทักษะที่สังเกตได้ (1–5)','skill',['1','2','3','4','5'],'3')}${selectField('ช่วงติดตาม','period',['ระหว่างพัฒนาทักษะ','1 เดือน','2 เดือน','3 เดือน'],'ระหว่างพัฒนาทักษะ')}</div>${area('สิ่งที่ทำได้ดี / อุปสรรค / แนวทางช่วยเหลือ','text','','required maxlength="1500"')}<label class="check"><input name="retained" type="checkbox">ยังคงทำงานอยู่ ณ วันที่ติดตาม</label><div class="modal-foot"><button class="btn primary">บันทึกผล</button></div></form>`)}
function saveLog(f){const d=Object.fromEntries(new FormData(f));db.logs.push({...d,id:uid(),retained:!!d.retained,skill:Number(d.skill),by:db.role});persist();closeModal();render();toast('บันทึกพัฒนาการแล้ว')}
function feedbackPage(){return heading('เสียงของคุณช่วยให้เราพัฒนา','แบ่งปันประสบการณ์ เพื่อปรับการจับคู่งานและการดูแลให้เหมาะสมยิ่งขึ้น')+`<div class="columns"><form class="panel" onsubmit="event.preventDefault();saveFeedback(this)"><h2>ประเมินประสบการณ์</h2>${selectField('หัวข้อที่ประเมิน','topic',isEmp()?['การจับคู่ผู้สมัคร','การติดตามหลังจ้างงาน','ความร่วมมือกับมูลนิธิ']:['การค้นหาและสมัครงาน','การฝึกอบรม','ประสบการณ์ในที่ทำงาน'],'')}${selectField('ความพึงพอใจ','rating',['5 - ดีมาก','4 - ดี','3 - ปานกลาง','2 - ควรปรับปรุง','1 - ต้องปรับปรุงมาก'],'5 - ดีมาก')}${area('ข้อเสนอแนะ','text','','required maxlength="1500"')}<label class="check"><input name="returning" type="checkbox">${isEmp()?'สนใจกลับมาร่วมจ้างงานหรือสนับสนุนอีกครั้ง':'ยินดีให้ติดต่อกลับเพื่อช่วยเหลือ'}</label><div class="modal-foot"><button class="btn primary">ส่งแบบประเมิน</button></div></form><div class="panel"><h2>ประวัติแบบประเมินของคุณ</h2>${db.feedback.filter(f=>f.role===db.role).map(f=>`<div class="mini-row"><span class="mini-icon">${ic('star')}</span><div><strong>${esc(f.topic)} · ${f.rating}/5</strong><p>${esc(f.text)}</p><p>${fmtDate(f.date)}</p></div></div>`).join('')||empty('ยังไม่มีแบบประเมิน')}</div></div>`}
function saveFeedback(f){const d=Object.fromEntries(new FormData(f));db.feedback.unshift({...d,id:uid(),rating:parseInt(d.rating),returning:!!d.returning,date:today(),role:db.role});persist();render();toast('บันทึกข้อเสนอแนะแล้ว ขอบคุณที่ร่วมพัฒนา')}
function profilePage(){if(isEmp()){const c=db.company;return heading('โปรไฟล์สถานประกอบการ','ช่วยให้ผู้สมัครเข้าใจงานและการสนับสนุนที่คุณพร้อมมอบให้')+`<form class="panel" onsubmit="event.preventDefault();saveCompany(this)"><div class="profile-top"><div class="company-logo">G</div><div><h2>${esc(c.name)}</h2><span class="small">สถานประกอบการตัวอย่าง</span></div></div><div class="form-grid">${field('ชื่อสถานประกอบการ','name',c.name,'text','required')}${field('ประเภทธุรกิจ','industry',c.industry,'text','required')}${field('ผู้ประสานงาน','contact',c.contact,'text','required')}${field('จังหวัด','province',c.province,'text','required')}${field('โทรศัพท์','phone',c.phone,'tel','required pattern="[0-9+ -]{9,15}"')}${field('อีเมล','email',c.email,'email','required')}</div>${area('เกี่ยวกับสถานประกอบการ','about',c.about,'required')}${area('การสนับสนุนที่มีให้','support',c.support,'required')}<button class="btn primary">บันทึกโปรไฟล์</button></form>`}const p=profile();return heading('โปรไฟล์และความสามารถ','บอกเล่าตัวตน ทักษะ และสิ่งที่ช่วยให้คุณทำงานได้ดี',btn('เพิ่มบุคคลในความดูแล',"profileForm()",'primary','plus'))+`<div class="tabbar">${db.profiles.map(x=>`<button class="${x.id===p.id?'on':''}" onclick="activeProfile('${x.id}')">${esc(x.nickname)}</button>`).join('')}</div><div class="columns"><div class="panel"><div class="profile-top"><div class="avatar">${esc(p.nickname[0])}</div><div><h2>${esc(p.name)}</h2><span class="muted">${esc(p.nickname)} · ${p.age} ปี · ${esc(p.province)}</span></div></div><h3>เกี่ยวกับฉัน</h3><p>${esc(p.bio)}</p><h3>ทักษะและจุดแข็ง</h3><div class="tags">${p.skills.map(s=>`<span class="tag">${esc(s)}</span>`).join('')}</div><h3>งานที่สนใจ</h3><p>${esc(p.interest)}</p><h3>การสนับสนุนที่ต้องการ</h3><div class="note">${esc(p.support)}</div>${btn('แก้ไขโปรไฟล์และทักษะ',`profileForm('${p.id}')`,'primary')}</div><div><div class="panel"><h2>ผู้ประสานงาน</h2><p>${esc(p.guardian)}</p><p class="muted">${esc(p.phone)}</p><p class="small">ใช้สำหรับการติดต่อในต้นแบบนี้</p></div><div class="panel"><h2>การเปิดเผยข้อมูล</h2><label class="check"><input type="checkbox" ${p.consent?'checked':''} onchange="profile().consent=this.checked;persist();toast('บันทึกการเปิดเผยข้อมูลแล้ว')">ให้สถานประกอบการค้นพบโปรไฟล์และทักษะของฉัน</label><p class="small" style="margin-top:12px">เมื่อปิด จะไม่แสดงในหน้าค้นหาผู้สมัคร ใบสมัครที่ส่งไปก่อนแล้วยังคงให้สถานประกอบการพิจารณาได้</p></div></div></div>`}
function profileForm(id){const p=id?person(id):{name:'',nickname:'',age:18,province:'กรุงเทพมหานคร',skills:[],interest:'งานสำนักงาน',guardian:'',phone:'',bio:'',support:'',consent:false};openModal(id?'แก้ไขโปรไฟล์':'เพิ่มบุคคลในความดูแล',`<form onsubmit="event.preventDefault();saveProfile('${id||''}',this)"><div class="form-grid">${field('ชื่อ–นามสกุล','name',p.name,'text','required maxlength="100"')}${field('ชื่อที่อยากให้เรียก','nickname',p.nickname,'text','required maxlength="30"')}${field('อายุ','age',p.age,'number','required min="15" max="100"')}${field('จังหวัด','province',p.province,'text','required')}${field('ผู้ประสานงาน / ผู้ปกครอง','guardian',p.guardian,'text','required')}${field('โทรศัพท์','phone',p.phone,'tel','required pattern="[0-9+ -]{9,15}"')}</div>${field('ทักษะ (คั่นด้วยเครื่องหมาย ,)','skills',p.skills.join(', '),'text','required')}${selectField('งานที่สนใจ','interest',['งานคลังสินค้า','งานสำนักงาน','งานอาหารและเครื่องดื่ม','งานเกษตร'],p.interest)}${area('เกี่ยวกับฉัน / จุดแข็ง','bio',p.bio,'required')}${area('การสนับสนุนที่ต้องการ','support',p.support,'required')}<div class="note">ระบุสิ่งที่ช่วยในการทำงานได้โดยไม่จำเป็นต้องใส่ข้อมูลการวินิจฉัย</div><div class="modal-foot"><button class="btn primary">บันทึกโปรไฟล์</button></div></form>`)}
function saveProfile(id,f){const d=Object.fromEntries(new FormData(f)),data={...d,age:Number(d.age),skills:d.skills.split(',').map(s=>s.trim()).filter(Boolean)};if(!data.skills.length)return toast('กรุณาระบุทักษะอย่างน้อยหนึ่งรายการ');if(id)Object.assign(person(id),data);else{db.active=uid();db.profiles.push({...data,id:db.active,consent:false})}persist();closeModal();render();toast('บันทึกโปรไฟล์แล้ว')}
function saveCompany(f){Object.assign(db.company,Object.fromEntries(new FormData(f)));db.jobs.filter(j=>j.owned).forEach(j=>j.company=db.company.name);persist();render();toast('บันทึกโปรไฟล์สถานประกอบการแล้ว')}
function messagesPage(){return heading('พื้นที่พูดคุย','ติดต่อประสานงานและเตรียมความพร้อมไปด้วยกัน')+`<div class="panel chat-layout"><div class="chat-list"><button class="chat-person"><strong>${isEmp()?'ครอบครัวใจดี':esc(db.company.name)}</strong><br><span class="small">การสมัครและการดูแลหลังเริ่มงาน</span></button><p class="small">กล่องข้อความตัวอย่างร่วมกันระหว่าง 2 Role</p></div><div class="chat-area"><div class="flex"><span class="avatar">${isEmp()?'น':'G'}</span><div><strong>${isEmp()?'คุณนภา ใจดี':esc(db.company.contact)}</strong><div class="small">ข้อความภายใน Prototype</div></div></div><div class="messages">${db.messages.map(m=>`<div class="bubble ${m.from===db.role?'own':''}">${esc(m.text)}<small>${m.from==='employer'?'สถานประกอบการ':'ผู้ปกครอง / บุคคลพิเศษ'} · ${esc(m.date)}</small></div>`).join('')}</div><form class="chat-form" onsubmit="event.preventDefault();sendMessage(this)"><input name="message" aria-label="ข้อความ" placeholder="พิมพ์ข้อความที่ต้องการส่ง…" required maxlength="2000"><button class="btn primary">ส่ง</button></form></div></div>`}
function sendMessage(f){const t=new FormData(f).get('message').trim();if(!t)return;db.messages.push({id:uid(),from:db.role,text:t,date:new Date().toLocaleString('th-TH',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})});notify(isEmp()?'family':'employer','คุณได้รับข้อความใหม่','messages');persist();render();document.querySelector('.messages').scrollTop=99999;document.querySelector('[name="message"]').focus()}
function showNotifications(){const n=db.notifications.filter(n=>n.role===db.role);openModal('การแจ้งเตือน',`${n.map(n=>`<div class="mini-row"><span class="mini-icon">${ic('bell')}</span><div style="flex:1"><p style="color:var(--ink)">${esc(n.text)}</p>${badge(n.read?'อ่านแล้ว':'ใหม่',n.read?'gray':'')}${btn('เปิดดู',`readNotification('${n.id}')`,'subtle')}</div></div>`).join('')||empty('ยังไม่มีการแจ้งเตือน')}<div class="modal-foot">${btn('ทำเครื่องหมายว่าอ่านทั้งหมด',"db.notifications.filter(n=>n.role===db.role).forEach(n=>n.read=true);persist();render();showNotifications()")}</div>`)}
function readNotification(id){const n=db.notifications.find(n=>n.id===id);n.read=true;closeModal();go(n.page)}
function analyticsPage(){const apps=visibleApps(),hired=apps.filter(a=>a.status==='hired'),total=apps.filter(a=>!['withdrawn','declined'].includes(a.status)).length;const percentage=(a,b)=>b?Math.round(a/b*100):null;const ps=isEmp()?db.profiles.filter(p=>db.applications.some(a=>a.profile===p.id&&job(a.job).owned)):[profile()];const enrollments=ps.flatMap(p=>courses.map(c=>training(p,c.id))).filter(t=>t.enrolled);const f=db.feedback.filter(f=>f.role==='employer');const retained=hired.filter(a=>{const d=new Date(a.start+'T12:00');d.setMonth(d.getMonth()+3);return d<=new Date()&&db.logs.some(l=>l.profile===a.profile&&l.period==='3 เดือน'&&l.retained)}).length;const due=hired.filter(a=>{const d=new Date(a.start+'T12:00');d.setMonth(d.getMonth()+3);return d<=new Date()}).length;const followed=hired.filter(a=>db.logs.some(l=>l.profile===a.profile&&l.period&&l.period!=='ระหว่างพัฒนาทักษะ')).length;const rows=[['จับคู่งานสำเร็จ',percentage(hired.length,total),70,`${hired.length} ผู้เริ่มงาน / ${total} ใบสมัครที่ไม่ถอนหรือปฏิเสธ`],['คงอยู่ในงานครบ 3 เดือน',percentage(retained,due),75,`${retained} รายที่ยืนยันคงอยู่ / ${due} รายที่ครบกำหนด`],['สำเร็จการฝึกอบรม',percentage(enrollments.filter(t=>t.passed).length,enrollments.length),80,'หลักสูตรที่ผ่าน / หลักสูตรที่ลงทะเบียน'],['ติดตามผลหลังจ้างงาน',percentage(followed,hired.length),90,'ผู้มีบันทึกติดตาม / ผู้เริ่มงาน'],['ความพึงพอใจนายจ้าง',f.length?Math.round(f.reduce((s,x)=>s+x.rating,0)/f.length/5*100):null,80,'คะแนนเฉลี่ยแบบประเมินนายจ้าง / 5']];return heading(isEmp()?'รายงานและผลลัพธ์ร่วมกัน':'รายงานการเติบโตของฉัน','ค่าจากข้อมูลตัวอย่างในเบราว์เซอร์ · เป้าหมายอ้างอิงสไลด์หน้า 9–15',btn('ส่งออก CSV',"exportReport()",'','download'))+`<div class="note">รายงานจำลอง: ตัวชี้วัดคำนวณจากข้อมูลทดลอง ไม่ใช่ผลดำเนินงานจริงของมูลนิธิ รายงานนี้${isEmp()?'จำกัดเฉพาะประกาศของสถานประกอบการ':'จำกัดเฉพาะโปรไฟล์ที่เลือก'}</div><div class="stats">${stat('เข้าสู่กระบวนการ',total,'ใบสมัครในขอบเขตนี้','users')+stat('เริ่มงานแล้ว',hired.length,'การตอบรับข้อเสนอ','briefcase')+stat('ผ่านหลักสูตร',enrollments.filter(t=>t.passed).length,'รายการประเมินผ่าน','book')+stat('มีการติดตาม',followed,'ผู้เริ่มงานที่มีบันทึก','heart')}</div><div class="columns"><div class="panel"><h2>เป้าหมายและความก้าวหน้า</h2><div class="metric-list">${rows.map(([name,val,target,desc])=>`<div><div class="flex between"><strong style="font-size:14px">${name}</strong>${badge(val===null?'ยังไม่มีข้อมูล':val+'%',val!==null&&val<target?'orange':'')}</div><div class="progress"><span style="width:${Math.min(val||0,100)}%"></span></div><div class="flex between small"><span>${desc}</span><span>เป้าหมาย ≥ ${target}%</span></div></div>`).join('')}</div></div><div><div class="panel"><h2>ภาพรวมกระบวนการสมัคร</h2><div class="chart">${[['submitted','ใหม่'],['review','พิจารณา'],['interview','สัมภาษณ์'],['offer','ข้อเสนอ'],['hired','เริ่มงาน']].map(([s,t])=>{const n=apps.filter(a=>a.status===s).length;return `<div class="chart-col"><b>${n}</b><div class="chart-bar" style="height:${n/Math.max(apps.length,1)*130}px"></div><small>${t}</small></div>`}).join('')}</div></div><div class="panel"><h2>ความร่วมมืออย่างต่อเนื่อง</h2><p class="small">นายจ้างที่แสดงความสนใจกลับมาร่วมงาน</p><div class="score">${f.length?(f.some(x=>x.returning)?'100%':'0%'):'—'}</div><p class="small">เป็นเพียงความตั้งใจจาก 1 สถานประกอบการ ยังใช้แทนอัตรากลับมาร่วมงานจริงไม่ได้</p><span class="small">เป้าหมายกลับมาร่วมงานจริง ≥ 60%</span></div></div></div><div class="panel"><h2>ข้อกำหนดบริการสำหรับระบบจริง</h2><p class="small">รายการต่อไปนี้เป็นเป้าหมายจากสไลด์ ยังไม่มีข้อมูลวัดจากระบบจริง</p><div class="tags">${['พร้อมใช้งาน ≥ 99%','ข้อมูลครบถ้วน ≥ 95%','การใช้งานระบบ ≥ 80%','เก็บ Feedback ≥ 90%','แนะนำงาน ≤ 3 วินาที','อัปเดตข้อมูล ≤ 24 ชม.','ลดเวลาสรุปข้อมูล ≥ 50%','ผ่านอบรมสู่จับคู่งาน ≥ 60%'].map(s=>`<span class="tag">${s}</span>`).join('')}</div></div>`}
function exportReport(){const rows=[['ผู้สมัคร','ตำแหน่ง','สถานประกอบการ','สถานะ','วันที่สมัคร','วันเริ่มงาน'],...visibleApps().map(a=>[person(a.profile).name,job(a.job).title,job(a.job).company,statusNames[a.status],a.date,a.start||''])];const csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/^[=+@-]/,"'$&").replace(/"/g,'""')+'"').join(',')).join('\r\n');download('horizon-report.csv','\ufeff'+csv,'text/csv;charset=utf-8');toast('ดาวน์โหลดรายงานแล้ว')}
function download(name,text,type){const url=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function supportPage(){return heading('มีเราอยู่ข้าง ๆ คุณ','ค้นหาคำตอบและส่งคำขอความช่วยเหลือที่เหมาะกับคุณ')+`<div class="support-grid">${[['การทำงานและการดูแล','วางแผนการสนับสนุน พัฒนาทักษะ และปรับสภาพแวดล้อมการทำงาน','heart'],['กฎหมายและเอกสาร','ประสานคำถามเกี่ยวกับเอกสารและสัญญา ตามบริการที่ปรากฏในสไลด์','book'],['การเงินและคำปรึกษาองค์กร','ส่งคำถามด้านการวางแผน การบริหาร และความร่วมมือ','message']].map(([t,d,i])=>`<div class="panel"><div class="mini-icon" style="margin-bottom:15px">${ic(i)}</div><h3>${t}</h3><p class="small">${d}</p>${btn('ขอคำปรึกษา',`ticketForm('${t}')`)}</div>`).join('')}</div><div class="columns"><div class="panel"><h2>คำถามที่พบบ่อย</h2>${[['ผู้ปกครองสมัครงานแทนได้หรือไม่?','ได้ เลือกโปรไฟล์บุคคลในความดูแล ตรวจสอบความต้องการร่วมกัน และยินยอมเปิดเผยข้อมูลก่อนส่งใบสมัคร'],['คะแนนความสอดคล้องของงานคิดอย่างไร?','ต้นแบบใช้ทักษะที่ตรงกับงานและจังหวัดเป็นคะแนนประกอบการพิจารณา ดูวิธีคำนวณได้ในรายละเอียดงาน'],['เปลี่ยน Role แล้วข้อมูลจะหายหรือไม่?','ไม่หาย ทั้งสองมุมมองใช้ข้อมูลตัวอย่างร่วมกัน เพื่อทดลองกระบวนการตั้งแต่สมัครจนเริ่มงาน'],['ข้อมูลถูกส่งให้มูลนิธิจริงหรือไม่?','ไม่ ข้อมูลบันทึกเฉพาะเบราว์เซอร์นี้ การสมัคร ข้อความ และคำขอคำปรึกษาทั้งหมดเป็นการจำลอง']].map(([q,a])=>`<details class="list-card"><summary>${q}</summary><p class="small" style="margin-top:12px">${a}</p></details>`).join('')}</div><div class="panel"><h2>คำขอของคุณ</h2>${db.tickets.filter(t=>t.role===db.role).map(t=>`<div class="mini-row"><div><strong>${esc(t.topic)}</strong><p>${esc(t.text)}</p>${badge('บันทึกคำขอแล้ว · จำลอง','blue')}</div></div>`).join('')||empty('ยังไม่มีคำขอคำปรึกษา')}</div></div>`}
function ticketForm(topic){openModal('ขอคำปรึกษา',`<form onsubmit="event.preventDefault();db.tickets.unshift({...Object.fromEntries(new FormData(this)),id:uid(),role:db.role});persist();closeModal();render();toast('บันทึกคำขอตัวอย่างแล้ว ยังไม่มีการส่งจริง')">${field('หัวข้อ','topic',topic,'text','required')}${area('รายละเอียดที่ต้องการความช่วยเหลือ','text','','required')}${field('อีเมลติดต่อกลับ','email',isEmp()?db.company.email:db.account.email,'email','required')}<div class="note">ระบบจะบันทึกคำขอตัวอย่างในอุปกรณ์นี้ ไม่มีเจ้าหน้าที่รับคำขอจริง</div><div class="modal-foot"><button class="btn primary">บันทึกคำขอ</button></div></form>`)}
function settingsPage(){return heading('การตั้งค่า','ปรับการอ่านและจัดการข้อมูลตัวอย่างของคุณ')+`<div class="columns"><div class="panel"><h2>การเข้าถึงและการอ่าน</h2><label class="check list-card"><input type="checkbox" ${db.prefs.large?'checked':''} onchange="db.prefs.large=this.checked;persist();render()">เพิ่มขนาดตัวอักษร</label><label class="check list-card"><input type="checkbox" ${db.prefs.contrast?'checked':''} onchange="db.prefs.contrast=this.checked;persist();render()">เพิ่มความเข้มของข้อความและเส้นขอบ</label><label class="check list-card"><input type="checkbox" ${db.prefs.motionOff?'checked':''} onchange="db.prefs.motionOff=this.checked;persist();render()">ลดการเคลื่อนไหวและ Animation</label><p class="small">ระบบเคารพการตั้งค่าลดการเคลื่อนไหวของอุปกรณ์ด้วย</p><h2 style="margin-top:25px">บัญชีตัวอย่าง</h2><p>${esc(isEmp()?db.company.email:db.account.email)}</p>${btn('ออกจากบัญชีตัวอย่าง',"db.session=false;persist();render()",'','logout')}</div><div class="panel"><h2>ข้อมูลและความเป็นส่วนตัว</h2><p class="small">ข้อมูลทั้งหมดอยู่ในเบราว์เซอร์บนอุปกรณ์นี้ ไม่มีการยืนยันตัวตนจริง ไม่ควรใช้ข้อมูลส่วนบุคคลจริงในการทดลอง</p>${btn('คืนค่าข้อมูลตัวอย่าง',"resetPrompt()",'danger')}<p class="small" style="margin-top:18px">การคืนค่าจะล้างรายการที่คุณเพิ่มในต้นแบบนี้ และนำข้อมูลตั้งต้นกลับมา</p></div></div>`}
function resetPrompt(){openModal('คืนค่าข้อมูลตัวอย่าง',`<p>รายการที่เพิ่มและแก้ไขในต้นแบบนี้จะถูกล้าง ต้องการคืนค่าใช่ไหม?</p><div class="modal-foot">${btn('ยกเลิก',"closeModal()")}${btn('ยืนยันคืนค่า',"db=seed();page='home';persist();closeModal();render();toast('คืนค่าข้อมูลตัวอย่างแล้ว')",'danger')}</div>`)}
function authPage(){return `<div class="auth-box panel"><div class="eyebrow">HORIZON TOGETHER</div><h1>ยินดีต้อนรับสู่ขอบฟ้ากว้าง</h1><p class="muted">เลือกพื้นที่ที่คุณต้องการทดลองใช้งาน</p><div class="auth-roles">${btn('ผู้ปกครอง / บุคคลพิเศษ',"db.session=true;setRole('family')",'primary','users')}${btn('สถานประกอบการ',"db.session=true;setRole('employer')",'','briefcase')}</div><div class="note" style="margin-top:20px">บัญชีสาธิต ไม่ต้องใช้รหัสผ่าน ไม่มีการยืนยันตัวตนจริง</div>${btn('ทดลองสมัครสมาชิก',"registerForm()",'subtle')}</div>`}
function registerForm(){openModal('สมัครสมาชิกตัวอย่าง',`<form onsubmit="event.preventDefault();const d=Object.fromEntries(new FormData(this));db.account={name:d.name,email:d.email};db.session=true;closeModal();setRole(d.role)">${field('ชื่อผู้ใช้งาน','name','','text','required')}${field('อีเมล','email','','email','required')}<div class="field"><label for="f-role">ประเภทบัญชี</label><select name="role" id="f-role"><option value="family">ผู้ปกครอง / บุคคลพิเศษ</option><option value="employer">สถานประกอบการ</option></select></div><label class="check"><input type="checkbox" required>เข้าใจว่าเป็นบัญชีทดลอง และข้อมูลบันทึกในเบราว์เซอร์นี้เท่านั้น</label><div class="modal-foot"><button class="btn primary">สร้างบัญชีตัวอย่าง</button></div></form>`)}
document.getElementById('modal').addEventListener('cancel',e=>{e.preventDefault();closeModal()});
document.getElementById('modal').addEventListener('click',e=>{if(e.target===e.currentTarget){const r=e.currentTarget.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeModal()}});

// Animate after rendering without deferring actions, form validation or focus.
const motionQuery=window.matchMedia('(prefers-reduced-motion: reduce)');
let lastMotionPage='';
function motionReduced(){return motionQuery.matches||!!db.prefs.motionOff}
function playMotion(el,frames,options={}){
 if(!el||motionReduced()||!el.animate)return;
 return el.animate(frames,{duration:360,easing:'cubic-bezier(.22,1,.36,1)',...options});
}
function syncMotion(){
 document.body.classList.toggle('reduce-motion',motionReduced());
 if(motionReduced())document.getAnimations?.().forEach(a=>a.cancel());
}
motionQuery.addEventListener?.('change',syncMotion);
function render(){
 renderSurface();syncMotion();
 const key=db.role+':'+page+':'+db.session,changed=key!==lastMotionPage;lastMotionPage=key;
 if(motionReduced())return;
 const main=document.getElementById('content');
 if(changed){
  playMotion(main.querySelector('.page-heading,.auth-box'),[{opacity:0,transform:'translateY(10px)'},{opacity:1,transform:'translateY(0)'}]);
  const items=main.querySelectorAll('.hero,.stat,.job,.columns>.panel,.columns>div>.panel,.course-grid>.panel,.support-grid>.panel,.main>.panel,.main>.list-card');
  items.forEach((el,i)=>playMotion(el,[{opacity:0,translate:'0 14px'},{opacity:1,translate:'0 0'}],{delay:Math.min(i*35,180),duration:380,fill:'backwards'}));
  playMotion(main.querySelector('.orb'),[{opacity:.3,transform:'translate(-50%,-40%) scale(.88)'},{opacity:1,transform:'translate(-50%,-50%) scale(1)'}],{duration:750});
  main.querySelectorAll('.floating').forEach((el,i)=>playMotion(el,[{opacity:0,translate:'0 10px'},{opacity:1,translate:'0 0'}],{duration:650,delay:100+i*100,fill:'backwards'}));
  main.querySelectorAll('.progress span,.chart-bar').forEach((el,i)=>playMotion(el,[{transform:el.classList.contains('chart-bar')?'scaleY(0)':'scaleX(0)'},{transform:'scale(1)'}],{duration:650,delay:Math.min(i*35,150),fill:'backwards'}));
 }else{
  // Updated results remain readable immediately, without replaying the entire page.
  playMotion(main.querySelector('.jobs,.course-grid,.timeline,.metric-list'),[{opacity:.65},{opacity:1}],{duration:180});
 }
 const latest=main.querySelector('.bubble:last-child');
 if(latest)playMotion(latest,[{opacity:0,translate:'0 8px'},{opacity:1,translate:'0 0'}],{duration:220});
}
function openModal(title,body){
 const modal=document.getElementById('modal'),wasOpen=modal.open;
 modal.getAnimations?.().forEach(a=>a.cancel());
 openModalSurface(title,body);
 playMotion(wasOpen?modal.querySelector('.modal-body'):modal,
  wasOpen?[{opacity:.5},{opacity:1}]:[{opacity:0,transform:'translateY(14px) scale(.98)'},{opacity:1,transform:'translateY(0) scale(1)'}],
  {duration:wasOpen?160:240});
}

if(document.modelContext?.registerTool){try{document.modelContext.registerTool({name:'navigate_horizon_page',description:'Open a prototype page in the current role. Does not submit or edit records.',inputSchema:{type:'object',properties:{page:{type:'string',enum:['home','jobs','applications','training','progress','feedback','analytics','profile','messages','support','settings']}},required:['page'],additionalProperties:false},annotations:{readOnlyHint:false},execute(input){if(!['home','jobs','applications','training','progress','feedback','analytics','profile','messages','support','settings'].includes(input.page))throw new Error('Unknown page');go(input.page);return {page,role:db.role}}})}catch(e){}}
render();
</script></body></html>
